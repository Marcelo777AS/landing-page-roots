  <rect x="1300" y="590" width="60" height="78" rx="2" fill="none" stroke="#8f3d38" stroke-width="1"/>
  <text x="1330" y="616" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#56070c" letter-spacing="1">ROOTS</text>
  <line x1="1310" y1="624" x2="1350" y2="624" stroke="#8f3d38" stroke-width="1"/>
  <text x="1330" y="641" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#350a06">Malbec</text>
  <text x="1330" y="656" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#8f3d38" letter-spacing="1">CAFAYATE</text>

