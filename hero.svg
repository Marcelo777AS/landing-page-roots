<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" preserveAspectRatio="xMaxYMax slice" role="img" aria-label="Tabla de madera con asado y vino tinto frente a los cerros de Salta al atardecer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#170000"/>
      <stop offset=".35" stop-color="#350a06"/>
      <stop offset=".55" stop-color="#8f3d38"/>
      <stop offset=".62" stop-color="#cb7169"/>
    </linearGradient>
    <radialGradient id="glow" cx="1180" cy="470" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cb7169" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#cb7169" stop-opacity=".35"/>
      <stop offset="1" stop-color="#cb7169" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56070c"/>
      <stop offset=".25" stop-color="#350a06"/>
      <stop offset="1" stop-color="#170000"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a24e3c"/>
      <stop offset="1" stop-color="#8f3d38"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#170000"/>
      <stop offset=".3" stop-color="#350a06"/>
      <stop offset=".55" stop-color="#170000"/>
      <stop offset="1" stop-color="#0d0000"/>
    </linearGradient>
    <clipPath id="range2Clip">
      <path d="M0 600 L120 540 L210 575 L330 505 L450 585 L560 545 L660 600 L780 530 L900 590 L1010 540 L1130 610 L1260 535 L1380 590 L1500 550 L1600 580 V900 H0Z"/>
    </clipPath>
    <!-- Cardón (cactus típico de los valles salteños) -->
    <g id="cardon" fill="#170000">
      <rect x="-10" y="-160" width="20" height="160" rx="10"/>
      <rect x="-38" y="-118" width="15" height="60" rx="7.5"/>
      <rect x="-38" y="-72" width="34" height="15" rx="7.5"/>
      <rect x="23" y="-138" width="15" height="78" rx="7.5"/>
      <rect x="4" y="-74" width="34" height="15" rx="7.5"/>
    </g>
  </defs>

  <!-- Cielo al atardecer -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <circle cx="1180" cy="470" r="52" fill="#f0a89d" opacity=".9"/>
  <g fill="#f6e7e3" opacity=".5">
    <circle cx="420" cy="80" r="1.4"/><circle cx="760" cy="140" r="1.2"/><circle cx="1050" cy="60" r="1.5"/>
    <circle cx="1320" cy="120" r="1.1"/><circle cx="1500" cy="50" r="1.3"/><circle cx="880" cy="40" r="1"/>
  </g>

  <!-- Cordillera lejana -->
  <path d="M0 520 L90 470 L170 495 L260 430 L360 480 L430 455 L520 500 L600 440 L700 395 L790 450 L880 430 L960 470 L1060 400 L1150 445 L1240 420 L1330 470 L1420 410 L1510 450 L1600 430 V900 H0Z" fill="#8f3d38"/>
  <!-- nieve en las cumbres -->
  <g fill="#cb7169" opacity=".55">
    <path d="M700 395 L728 410 L712 412 L700 405 L688 413 L675 409Z"/>
    <path d="M1060 400 L1085 413 L1070 415 L1060 409 L1048 416 L1037 411Z"/>
    <path d="M1420 410 L1444 423 L1430 425 L1420 419 L1408 425 L1397 421Z"/>
  </g>

  <!-- Cerros colorados con estratos (Quebrada de las Conchas) -->
  <path d="M0 600 L120 540 L210 575 L330 505 L450 585 L560 545 L660 600 L780 530 L900 590 L1010 540 L1130 610 L1260 535 L1380 590 L1500 550 L1600 580 V900 H0Z" fill="#56070c"/>
