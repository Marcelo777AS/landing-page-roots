  <rect x="1066" y="734" width="114" height="24" rx="12" fill="#6e1c14"/>
  <rect x="1076" y="710" width="90" height="5" rx="2.5" fill="#cb7169" opacity=".4"/>
  <rect x="1080" y="738" width="86" height="5" rx="2.5" fill="#cb7169" opacity=".4"/>
  <g stroke="#170000" stroke-width="3" stroke-linecap="round" opacity=".7">
    <line x1="1090" y1="712" x2="1096" y2="726"/><line x1="1115" y1="712" x2="1121" y2="726"/><line x1="1140" y1="712" x2="1146" y2="726"/>
    <line x1="1094" y1="740" x2="1100" y2="754"/><line x1="1119" y1="740" x2="1125" y2="754"/><line x1="1144" y1="740" x2="1150" y2="754"/>
  </g>

  <!-- Tira de asado -->
  <rect x="1198" y="712" width="156" height="40" rx="9" fill="#56070c"/>
  <rect x="1198" y="736" width="156" height="16" rx="8" fill="#350a06" opacity=".6"/>
  <g fill="#efd8cc">
    <ellipse cx="1222" cy="717" rx="10" ry="5.5"/><ellipse cx="1260" cy="717" rx="10" ry="5.5"/>
    <ellipse cx="1298" cy="717" rx="10" ry="5.5"/><ellipse cx="1334" cy="717" rx="10" ry="5.5"/>
  </g>
  <g fill="#8f3d38">
    <circle cx="1222" cy="717" r="2.5"/><circle cx="1260" cy="717" r="2.5"/><circle cx="1298" cy="717" r="2.5"/><circle cx="1334" cy="717" r="2.5"/>
  </g>
  <g stroke="#170000" stroke-width="3" stroke-linecap="round" opacity=".6">
    <line x1="1212" y1="728" x2="1340" y2="726"/>
  </g>

  <!-- Chimichurri -->
  <ellipse cx="800" cy="822" rx="50" ry="9" fill="#000" opacity=".4"/>
  <path d="M756 800 C758 830 842 830 844 800Z" fill="#8f3d38"/>
  <ellipse cx="800" cy="800" rx="44" ry="12" fill="#a24e3c"/>
  <ellipse cx="800" cy="801" rx="38" ry="9" fill="#3d4a1e"/>
  <g fill="#6f7f34"><circle cx="785" cy="799" r="2.2"/><circle cx="805" cy="803" r="2"/><circle cx="818" cy="798" r="1.8"/><circle cx="794" cy="804" r="1.6"/></g>
  <g fill="#cb7169"><circle cx="798" cy="797" r="1.6"/><circle cx="812" cy="802" r="1.4"/><circle cx="780" cy="802" r="1.3"/></g>

  <!-- Copa de vino -->
  <ellipse cx="1485" cy="776" rx="30" ry="5" fill="#000" opacity=".45"/>
  <path d="M1455 632 C1453 682 1463 708 1485 710 C1507 708 1517 682 1515 632Z" fill="#f6e7e3" fill-opacity=".07" stroke="#f6e7e3" stroke-opacity=".55" stroke-width="2"/>
  <path d="M1457 670 C1460 696 1470 708 1485 709 C1500 708 1510 696 1513 670Z" fill="#56070c"/>
  <ellipse cx="1485" cy="670" rx="28" ry="4" fill="#8f3d38"/>
  <line x1="1485" y1="710" x2="1485" y2="770" stroke="#f6e7e3" stroke-opacity=".55" stroke-width="3"/>
  <ellipse cx="1485" cy="772" rx="24" ry="5" fill="none" stroke="#f6e7e3" stroke-opacity=".55" stroke-width="2"/>
  <path d="M1462 645 C1462 670 1466 684 1472 692" stroke="#f6e7e3" stroke-opacity=".35" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
