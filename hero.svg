  <rect x="806" y="730" width="70" height="26" rx="13" fill="#6e2a22"/>
  <circle cx="826" cy="743" r="5" fill="#350a06"/>
  <rect x="860" y="715" width="540" height="76" rx="34" fill="#6e2a22"/>
  <rect x="860" y="705" width="540" height="76" rx="34" fill="url(#board)"/>
  <g stroke="#6e2a22" stroke-width="1.2" fill="none" opacity=".6">
