  <rect x="1294" y="525" width="72" height="190" rx="8" fill="url(#bottle)"/>
  <path d="M1294 540 C1294 505 1318 495 1320 475 L1340 475 C1342 495 1366 505 1366 540Z" fill="url(#bottle)"/>
  <rect x="1320" y="410" width="20" height="70" fill="url(#bottle)"/>
  <rect x="1318" y="398" width="24" height="56" rx="3" fill="#8f3d38"/>
