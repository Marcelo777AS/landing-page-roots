    <path d="M-50 675 L1650 600" stroke="#350a06" stroke-width="14" opacity=".6"/>
    <path d="M-50 575 L1650 495" stroke="#8f3d38" stroke-width="6" opacity=".45"/>
    <path d="M-50 710 L1650 640" stroke="#8f3d38" stroke-width="5" opacity=".35"/>
  </g>

  <!-- Lomas cercanas -->
  <path d="M0 700 C150 650 300 640 450 670 C600 700 720 650 880 660 C1040 670 1150 640 1300 650 C1420 660 1520 640 1600 650 V900 H0Z" fill="#350a06"/>

  <!-- Cardones -->
  <use xlink:href="#cardon" href="#cardon" transform="translate(1250 660) scale(.4)"/>
  <use xlink:href="#cardon" href="#cardon" transform="translate(1110 668) scale(.3)"/>
  <use xlink:href="#cardon" href="#cardon" transform="translate(130 705) scale(.9)"/>
  <use xlink:href="#cardon" href="#cardon" transform="translate(280 690) scale(.55)"/>
  <use xlink:href="#cardon" href="#cardon" transform="translate(470 692) scale(.7)"/>
  <use xlink:href="#cardon" href="#cardon" transform="translate(640 690) scale(1.05)"/>

  <!-- Suelo -->
  <path d="M0 790 C200 770 420 780 640 790 V900 H0Z" fill="#170000"/>

